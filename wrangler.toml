# Cloudflare Pages project config (free tier).
# After `npx wrangler d1 create petpassage`, paste the database_id it prints below.
name = "petpassage"
compatibility_date = "2025-10-01"
pages_build_output_dir = "dist"

[[d1_databases]]
binding = "DB"
database_name = "petpassage"
database_id = "00000000-0000-0000-0000-000000000000"
